<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- Listas ordenadas (Order List) y Listas no ordenadas (Unorder List) -->
<!-- Listas ordenadas. Se utilizan para enumerar elementos en un orden específico, como pasos en un proceso o una lista de tareas -->
 <ol>
    <!-- La lista ordenada se puede crea para escribir una lista de pasos a seguir, por ejemplo: la preparación de un jugo. 1.Lavar, picar frutas; 2. vertir agua en la licuadora; 3. agregar los ingredientes (azúcar,especias, entre otras); 4. Licuar; 5. Servir -->
     <!-- li significa (list item) -->
      <li>Primer elemento<li>
     <li>Segundo elemento<li>
      <li>Tercer elemento<li></li>
 </ol>
</body>
</html>
