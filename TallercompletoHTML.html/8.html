<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagenes</title>
    <!-- https://techicons.dev/icons/react -->
</head>
<body>
    <!-- Etiquetas de Bloque y Etiquetas de Linea -->
<h1>Imagenes</h1>
<!-- Las imagenes se insertan en HTML utlizando la etiqueta img. Esta etiqueta es un elemento vacio, lo que significa que no tiene una etiqueta de cierre. La sintaxis basica para insertar una imagen es: -->

<!-- Vale la pena recordar que el atributo title proporciona un tooltip que muestra cuando el usuario pasa el mouse sobre la imagen -->
<img src="descarga (1).jfif" alt="Logotipo de HTML5" TITLE="HTML5" width="200" height="200">
 <!-- para que los lectores de pantalla puedan saber de que se trata la imagen el atributo alt (alternative text) es muy importante puesto que proporciona una descripcion textual de la imagen para accesibilidad y como fallback si no se carga. El texto alternativo debe ser descriptivo y conciso, y debe transmitir la informacion esencia que la imagen representa. Por ejemplo, si la imagen es un logotipo de una empresa, el texto alternativo podría ser "logotipo de la empresa XYZ". Si la imagen es una fotografia de un paisaje, el texto alternativo podría ser "Fotografia de un paisaje con montañas y un lago". En resumen, el atributo alt proporciona una descricion de la iamgen en caso de que se pueda cargar -->

<!-- self Closing Tags son etiquetas que se autocierran -->
</body>
</html>
